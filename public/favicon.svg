<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Dartpéro</title>

  <!-- Fond de cible : les secteurs sombres -->
  <circle cx="256" cy="256" r="200" fill="#0E1A13" />

  <!-- Les 20 secteurs alternés, obtenus par un pointillé sur un cercle très épais
       (rayon 94 + épaisseur 188 = couvre le disque de 0 à 188).
       Circonférence = 2*pi*94 = 590.619 ; un secteur = 590.619 / 20 = 29.531 -->
  <circle
    cx="256"
    cy="256"
    r="94"
    fill="none"
    stroke="#F2E8D5"
    stroke-width="188"
    stroke-dasharray="29.531 29.531"
  />

  <!-- Anneaux triple et double, en laiton (l'accent de la charte) -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="#C9A227" stroke-width="14" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="#C9A227" stroke-width="14" />

  <!-- Bull -->
  <circle cx="256" cy="256" r="30" fill="#2E7D4F" />
  <circle cx="256" cy="256" r="15" fill="#C1272D" />

  <!-- Cerclage bois -->
  <circle cx="256" cy="256" r="201" fill="none" stroke="#5A3E24" stroke-width="26" />

  <!-- La fléchette plantée -->
  <path d="M240 240 L275 205" stroke="#C9A227" stroke-width="7" stroke-linecap="round" />
  <path d="M275 205 L340 140" stroke="#C9A227" stroke-width="18" stroke-linecap="round" />
  <path d="M340 140 L382 98" stroke="#F2E8D5" stroke-width="9" stroke-linecap="round" />
  <polygon
    points="380,100 404,124 432,48 356,76"
    fill="#C1272D"
    stroke="#F2E8D5"
    stroke-width="3"
    stroke-linejoin="round"
  />
</svg>
